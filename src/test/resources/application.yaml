# 테스트 전용 설정.
#
# datasource / redis 접속 정보는 여기에 없다. Testcontainers 가 띄운 컨테이너에서
# @ServiceConnection 이 읽어 주입한다 (support/container/TestcontainersConfiguration).
#
# H2 를 쓰지 않는다 — 락·격리 수준·제약 동작이 MySQL 과 달라 동시성 테스트가
# 거짓 통과하기 때문이다. 테스트도 운영과 같은 엔진 위에서 돈다.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 스키마 마이그레이션 도입 전까지. 컨테이너는 매 실행 새로 뜬다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.k_place: DEBUG
    # 컨테이너 기동 로그가 테스트 출력을 덮지 않도록 낮춘다
    org.testcontainers: WARN
    com.github.dockerjava: WARN
